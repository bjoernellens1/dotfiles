add_newline = true
format = """
$directory$git_branch$git_status$git_state\
$python$conda$nodejs$rust$docker_context\
$cmd_duration$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold yellow)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style = "bold blue"
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
stashed = ""
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"
conflicted = "=${count}"

[python]
# only show when a venv/conda env is active, never because a .py file is nearby
symbol = " "
format = '[${symbol}(\($virtualenv\) )]($style)'
style = "yellow"
detect_extensions = []
detect_files = []
detect_folders = []

[conda]
symbol = " "
format = "[$symbol$environment]($style) "
ignore_base = true

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
detect_extensions = []
detect_files = ["package.json"]

[rust]
symbol = " "

[docker_context]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "dim"
